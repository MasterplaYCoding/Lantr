name: Bug report
description: Report a reproducible problem in the archived application.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping keep Lantr's source archive useful.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows desktop
        - Shared code
        - Director experiment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: Commit SHA or branch name
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials and personal presentation content before attaching anything.
      render: shell

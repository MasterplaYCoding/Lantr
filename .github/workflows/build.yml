name: Build and test

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Android and shared code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test desktop/shared behavior
        run: ./gradlew :composeApp:jvmTest
      - name: Compile Android
        run: ./gradlew :composeApp:compileDebugKotlinAndroid
      - name: Lint Android
        run: ./gradlew :composeApp:lintDebug

  windows-desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew :composeApp:compileKotlinJvm

  director-experiment:
    name: Director experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Experiments/DirectorService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: Experiments/DirectorService/go.mod
          cache-dependency-path: Experiments/DirectorService/go.sum
      - run: go test ./...

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject whitespace errors
        run: git show --check --oneline HEAD
